admin:
    accounts:
        account: 'Konto'
        heading: 'Konta'
        last_activity: 'Ostatnia aktywność'
        messages: 'Wiadomości'
        threads: 'Wątki'
    address:
        field:
            public_url: Adres publiczny
            public_url_help: >-
                Adres, pod którym ludzie łączą się z plMail z zewnątrz, z http:// lub https://
                na początku i bez ścieżki. Gmail i Outlook odsyłają na niego powiadomienia
                push, więc w ich przypadku musi być osiągalny z internetu przez https.
        follow_up: >-
            Rzeczy zarejestrowane gdzie indziej nie zmienią się same: adresy
            przekierowań w konsolach Google i Microsoft, punkt końcowy push Gmail
            Pub/Sub oraz adres serwera w aplikacjach pocztowych i kalendarzowych.
            Powiadomienia przeglądarki trzeba włączyć ponownie na każdym urządzeniu.
        heading: Adres publiczny
        in_use: Obecnie używany
        intro: >-
            Adres, z którego plMail buduje własne linki: tam łączą się przeglądarki
            po aktualizacje na żywo i tam Google i Microsoft mają odsyłać wywołania.
            Zmień go, gdy instalacja przenosi się na inną domenę, port lub proxy albo
            po przywróceniu kopii zapasowej wykonanej na innej maszynie.
        none: brak
        on_file: Zapisany
        pending: >-
            Zapisany adres nie jest tym, który jest używany. Zmiana wejdzie w życie
            po ponownym uruchomieniu kontenerów. Jeśli po restarcie oba nadal się
            różnią, APP_PUBLIC_URL jest ustawiony w pliku compose, a to ustawienie
            ma pierwszeństwo przed tym.
        restart_help: >-
            Do aktualizacji na żywo wystarczy tutaj zrestartować plMail. Zrestartuj
            też cały stos, aby procesy robocze zarejestrowały push pod nowym adresem.
        save: Zapisz adres
        saved: 'Zapisano — zmiana wejdzie w życie przy następnym restarcie.'
