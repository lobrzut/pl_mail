        done_heading: Uwierzytelnianie dwuskładnikowe jest włączone
        skip_hint: Możesz to skonfigurować później w Ustawienia → Bezpieczeństwo.
    switch_blocked: Nic nie przełączono — najpierw popraw pola poniżej, a to, co wpisałeś, zostanie zachowane.
    step:
