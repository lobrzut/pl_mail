onboarding:
    action:
        back: Wstecz
        finish: Zakończ
        next: Dalej
        skip: Pomiń ten krok
        skip_all: Pomiń konfigurację
    done:
        body: >-
            Wszystko, co pominąłeś, jest w Ustawieniach, a konfigurację możesz uruchomić ponownie z
            menu użytkownika, kiedy tylko zechcesz.
        cta: Przejdź do mojej poczty
        heading: Wszystko gotowe
    aside:
        account:
            body: >-
                plMail potrzebuje adresów serwerów poczty przychodzącej (IMAP) i wychodzącej (SMTP)
                twojego dostawcy. Zwykle są na stronach pomocy dostawcy w sekcji
                „Ustawienia IMAP”.
            heading: Gdzie je znaleźć?
            oauth: >-
                Dla Gmail i Outlook użyj zamiast tego przycisków logowania w Ustawienia → Konta
                pocztowe — adresy serwerów nie są potrzebne.
        admin_ai:
            body: 'Adres kontenera Ollama w twojej sieci albo dowolnego punktu końcowego zgodnego z OpenAI oraz nazwy dwóch modeli, które oferuje — jednego do pisania, jednego do wyszukiwania. Poczta trafia pod ten adres i nigdzie indziej.'
            heading: 'Czego potrzebujesz'
            skip_body: 'Naciśnij Dalej z wszystkimi polami pustymi. plMail jest kompletnym klientem poczty bez żadnego z tych elementów, a możesz do tego wrócić później w Administrator → AI.'
            skip_heading: 'Nie interesuje cię?'
        admin_integrations:
            body: Zarejestruj plMail w usłudze, a potem wklej poświadczenia, które ci poda.
            heading: Konfigurowanie
        admin_mail:
            google:
                heading: Konfigurowanie logowania Gmail
                step1: Otwórz console.cloud.google.com i utwórz projekt albo wybierz istniejący.
                step2: 'W APIs & Services → Library włącz Gmail API.'
                step3: 'W OAuth consent screen wybierz Internal, jeśli masz Workspace, w przeciwnym razie External, i uzupełnij nazwę aplikacji oraz e-mail pomocy technicznej.'
                step4: 'W Credentials utwórz OAuth client ID typu „Web application”.'
                step5: Wklej poniższe URI przekierowania do jego „Authorised redirect URIs”, a potem zapisz.
                step6: Skopiuj client ID i client secret, które pokazuje, do pól po lewej.
            microsoft:
                heading: Konfigurowanie logowania Microsoft
                step1: 'Otwórz portal.azure.com i przejdź do Microsoft Entra ID → App registrations → New registration.'
                step2: 'Wybierz, kto może się logować. „Accounts in any organizational directory and personal Microsoft accounts” odpowiada domyślnemu ustawieniu tenanta „common”.'
                step3: 'Ustaw URI przekierowania na Web i wklej do niego poniższy adres.'
                step4: 'Po rejestracji skopiuj Application (client) ID do pola po lewej.'
                step5: 'W Certificates & secrets utwórz nowy sekret klienta i od razu skopiuj jego Value — nie ID; jest pokazywana tylko raz.'
                step6: 'W API permissions dodaj te delegowane uprawnienia Microsoft Graph: Mail.ReadWrite, Mail.Send, MailboxSettings.ReadWrite, Calendars.ReadWrite, User.Read i offline_access. Pominięcie MailboxSettings.ReadWrite lub Calendars.ReadWrite nadal pozwala ludziom się logować — po prostu nie dostają kategorii ani kalendarza, a już wydany token nie jest uaktualniany, gdy dodasz uprawnienie później.'
        profile:
            body: To widzą odbiorcy w wierszu Od. Możesz to zmienić w dowolnej chwili.
            heading: Gdzie to się pokazuje
        security:
            body: >-
                Pomyśl, co się stanie, jeśli ktoś zdobędzie hasło do twojej poczty. Nie
                tylko przeczyta twoją pocztę — kliknie „nie pamiętam hasła” w twoim
                banku, u rejestratora twojej domeny, w twoim magazynie w chmurze i zbierze
                linki do resetu w miarę ich nadchodzenia.
            body_two: >-
                Drugi składnik to kod z twojego telefonu, który zmienia się co 30
                sekund. Skradzione hasło samo przestaje wystarczać.
            heading: Dlaczego to jest najważniejsze
    account:
        add: Dodaj to konto
        or_manual: 'Albo skonfiguruj je ręcznie:'
        sign_in_with: 'Zaloguj się przez %provider%'
        add_another: Dodaj kolejne konto
        cancel: Anuluj
    integrations:
        cancel: Anuluj
