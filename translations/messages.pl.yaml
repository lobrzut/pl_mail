                hint: 'Dodawane na końcu każdego powyższego polecenia poza sortowaniem. To dzięki temu niemiecka wiadomość dostaje niemiecką odpowiedź — bez tego model podąża za angielskim, w którym napisano te instrukcje, a korekta niemieckiej wersji roboczej ją tłumaczy. Możesz to przeformułować; nie możesz tego usunąć. Opróżnij pole, a wróci dostarczone sformułowanie.'
                label: 'Zawsze odpowiadaj w języku wiadomości'
            proofread:
                hint: 'Używane, gdy ktoś prosi o poprawienie pisowni i gramatyki i niczego więcej. Zachowaj w nim „nie zmieniaj niczego innego” — bez tego model przepisuje zdania, które były już poprawne.'
