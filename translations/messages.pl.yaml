    config_backup:
        change:
            absent: 'nic tu jeszcze nie ustawiono'
            differs: 'zastępuje inną wartość'
            unchanged: 'już identyczne'
        disposition:
            applied: 'Zapisano i obowiązuje już teraz.'
            applied-on-restart: 'zacznie obowiązywać przy następnym restarcie'
            external: >-
                plMail jest klientem systemu, do którego to należy, a nie jego właścicielem.
                Rola bazy danych została utworzona z hasłem, które Postgres już ma, a nowe
                wczytuje dopiero initdb — więc zmiana go tylko tutaj daje instalację, która
                nie może połączyć się z własną bazą danych. Zmień je najpierw w Postgresie,
                a potem tutaj.
            kept-deliberately: >-
                Zostawiono tu bez zmian, celowo. Poświadczenia z tej kopii zapasowej zostały
                ponownie zaszyfrowane kluczem tej instalacji w trakcie zapisu, więc wstawienie
                klucza z kopii zapasowej sprawiłoby, że staną się — wraz ze wszystkim innym
                już zapisanym — nieczytelne przy następnym uruchomieniu. Poniższy wiersz jest
                tylko na wypadek, gdy przywracasz też starą bazę danych, której wiersze są
                nim zaszyfrowane; wtedy musi on trafić na miejsce, zanim cokolwiek zostanie zapisane.
            not-writable: >-
                Ten proces nie mógł zapisać tej ścieżki. Wolumen sekretów tylko do odczytu,
                zły uid albo usługa, której nigdy nie nadano wolumenu. Wartość jest w
                kopii zapasowej, którą właśnie wgrałeś — wstaw ją tam sam.
            shadowed-by-compose: >-
                Zapisano, ale coś w środowisku procesu ustawia też tę nazwę, a entrypoint
                pozwala jawnie skonfigurowanej wartości wygrać z wygenerowaną. Usuń lub
                zaktualizuj ją w pliku compose — albo w leżącym obok `.env` — i zrestartuj;
                przywrócona wartość już czeka pod spodem.
        error:
            malformed-document: >-
                Hasło otworzyło ten plik, ale to, co jest w środku, nie jest kopią
                zapasową konfiguracji, którą ten plMail potrafi odczytać. Nic nie zostało zmienione.
            not-a-backup: >-
                To nie jest kopia zapasowa konfiguracji plMail. Nic nie zostało zmienione.
            unsupported-version: >-
                Ta kopia zapasowa została utworzona przez nowszy plMail niż ten, w formacie,
                którego ta wersja nie potrafi odczytać. Najpierw zaktualizuj, a potem ją zaimportuj.
            collision: >-
                Ten plik opisuje kogoś, kogo ta instalacja już częściowo ma — hasło aplikacji,
                link udostępniania lub stronę rezerwacji, których token jest tu nadal
                zarejestrowany, zwykle pozostawione przez usunięte konto. Nic nie zostało zmienione.
                Usuń te pozostałości albo zaimportuj na instalację, która ich nie ma.
            wrong-password: >-
                To hasło nie otwiera tego pliku — albo plik został zmieniony od czasu
                jego zapisania. Nic nie zostało zmienione.
        export:
