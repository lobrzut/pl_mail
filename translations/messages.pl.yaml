            lead: Połącz skrzynkę, którą naprawdę czytasz, a plMail zacznie ją synchronizować.
            title: Konto pocztowe
        admin-ai:
            intro: 'plMail może używać modelu językowego — takiego, który sam prowadzisz, albo punktu końcowego, który wybierzesz — do wyszukiwania według znaczenia, sortowania poczty i pomocy w pisaniu. To całkowicie opcjonalne i możesz zostawić każde pole poniżej puste.'
            lead: 'Opcjonalne. Zostaw puste, jeśli tego nie chcesz.'
            title: 'Model językowy'
        admin-integrations:
            lead: Poświadczenia usług, z których wszyscy tutaj mogą dołączać pliki.
