        flash:
            calendar_resync: >-
                Kalendarz %calendar% został poproszony o synchronizację. Działa teraz
                w tle, a poniższa karta powie, jak poszło.
            push_repair_failed: >-
                Nie udało się ponownie zarejestrować natychmiastowego dostarczania dla %account%. Pozostaje
                przy sprawdzaniu według harmonogramu, więc twoja poczta nadal dociera. Poniższa karta
                pokazuje, co wiadomo.
            push_repaired: >-
                Natychmiastowe dostarczanie ponownie zarejestrowane dla %account%.
            queue_discarded: 'Odrzucono porzucone zadania: %count%.'
            queue_retried: 'Przywrócono do kolejki porzucone zadania: %count%.'
        heading: 'Stan kont'
        healthy:
            body: >-
                Twoje konta są zalogowane, kalendarze się synchronizują i
                nic na ciebie nie czeka. Jeśli poczta kiedykolwiek przestanie dochodzić, Stan
                kont wróci na listę ustawień, a ta strona powie dlaczego.
            title: 'Wszystko działa'
        issue:
            account_reconnect:
                body: >-
                    Nowa poczta przestała dochodzić na to konto, podobnie jak
                    wszystko, co od niej zależy — synchronizacja kalendarza, filtry
                    działające przy dostarczeniu i wysyłanie z tego adresu. Poczta
                    już pobrana jest bezpieczna i nadal tu jest. Dzieje się to,
                    gdy zmieniono hasło, włączono uwierzytelnianie
                    dwuskładnikowe albo logowanie zostało unieważnione
                    na stronie bezpieczeństwa dostawcy.
                title: '%account% wymaga ponownego zalogowania'
            account_grant_weekly_expiry:
                body: >-
                    Poczta nadal dociera. Ale ostatnie logowanie na tym koncie
                    trwało %days% dni, zanim Google przestał je akceptować, a
                    to obecne ma teraz mniej więcej ten sam wiek — więc prawdopodobnie przestanie
                    działać w ciągu dnia lub dwóch.

                    Tak właśnie Google traktuje aplikację OAuth, której ekran
                    zgody jest nadal w trybie Testing: tokeny odświeżania wydane przez
                    taką wygasają po około tygodniu, niezależnie od tego, jak aplikacja
                    o nie prosi. Ponowne zalogowanie kupuje kolejny tydzień i niczego nie naprawia.
                    Rozwiązanie jest w konsoli Google Cloud — ustaw status publikacji
                    ekranu zgody na In production. Publikacja nie jest tym samym co
                    weryfikacja; niezweryfikowana aplikacja nadal działa,
                    tylko za pierwszym razem pokazuje ekran ostrzeżenia.

                    Jeśli nie zostawiłeś jej w trybie Testing, zignoruj to — coś
                    innego zakończyło to logowanie wcześniej i może się to nie powtórzyć.
                title: '%account% prawdopodobnie będzie wymagać ponownego zalogowania w ciągu dnia lub dwóch'
            account_reconnect_weekly:
                body: >-
                    Nowa poczta przestała dochodzić na to konto, podobnie jak
                    wszystko, co od niej zależy — synchronizacja kalendarza, filtry
                    działające przy dostarczeniu i wysyłanie z tego adresu. Poczta
                    już pobrana jest bezpieczna i nadal tu jest.

                    To logowanie trwało %days% dni, a tak właśnie Google traktuje
                    aplikację OAuth, której ekran zgody jest nadal w trybie Testing:
                    tokeny odświeżania wydane przez taką wygasają po około tygodniu. Jeśli
                    to ta instalacja, ponowne zalogowanie wprawi pocztę w ruch,
                    a to samo stanie się w przyszłym tygodniu. To, co
                    temu zapobiega, jest w konsoli Google Cloud — ustaw status publikacji
                    ekranu zgody na In production. Publikacja nie jest tym samym co
                    weryfikacja; niezweryfikowana aplikacja nadal działa,
                    tylko za pierwszym razem pokazuje ekran ostrzeżenia.
                title: '%account% wymaga ponownego zalogowania — i znowu za tydzień'
            account_scope_missing:
                body: >-
                    Część uprawnień, o które plMail prosił przy łączeniu tego konta,
                    nie została przyznana, więc części funkcji nie działają
                    i działać nie mogą. Kalendarze mogą się nie synchronizować, a zmiany, które
                    tu wprowadzasz — oznaczanie jako przeczytane, archiwizowanie, gwiazdka — mogą zostać zastosowane
                    na tym ekranie i odrzucone przez dostawcę, a potem cofnięte przez
                    następną synchronizację. Połącz konto ponownie i zezwól na wszystko,
                    o co jesteś proszony.
                title: '%account% nie otrzymało pełnego dostępu'
            account_sync_failing:
                body: >-
                    Kilka prób z rzędu się nie powiodło, więc nowa poczta nie
                    dociera na to konto, a wszystko, co od niej zależy —
                    filtry działające przy dostarczeniu i liczniki nieprzeczytanych —
                    stoi w miejscu. Poczta, która już tu jest, jest bezpieczna i niezmieniona.
                    Logowanie jest w porządku, więc to serwer poczty odmawia lub jest
                    nieosiągalny: sprawdź, czy działa i czy nic się nie zmieniło
                    w hoście, porcie lub haśle.
                title: '%account% ciągle nie udaje się synchronizować'
            server_alert:
                body: >-
                    Twój serwer poczty wysłał tę wiadomość w twoim imieniu i jest ona
                    powtórzona tutaj słowo w słowo: „%alert%”. plMail nie może
                    na jej podstawie działać — pełna skrzynka, hasło bliskie wygaśnięcia czy
                    serwer, który zaraz się przeniesie, to rzeczy, które mogą załatwić tylko ty lub twój
                    dostawca. Zostaje tutaj, dopóki serwer nie przestanie tego mówić.
                title: '%account% — wiadomość od twojego serwera poczty'
            calendar_sync_failing:
                body: >-
                    Ten kalendarz przestał pobierać zmiany, więc pokazuje to, co wiedział
                    ostatnim razem, gdy działał. Wydarzenia dodane lub przeniesione
                    gdzie indziej od tamtej pory jeszcze tu nie ma, a zmiany
                    wprowadzane tutaj nie są wysyłane dalej.
                title: '%calendar% przestał się synchronizować'
            calendars_blocked:
                body: >-
                    Wszystkie te przestały działać z tego samego powodu, którym jest karta
                    powyżej — naprawienie jej naprawia je razem. Pokazują
                    to, co wiedziały ostatnim razem, gdy działały, i nic
                    w nich nie zostało usunięte.
                title: 'Kalendarze, które się nie synchronizują (%count%): %calendars%'
            integration_reconnect:
                body: >-
                    Zapisywanie załączników w %connection% i dołączanie z niego plików
                    nie będzie działać, dopóki nie zostanie połączone ponownie. Twoja poczta
                    nie jest dotknięta — to tylko połączenie z tą usługą. Nic
                    tam zapisanego nie zostało ruszone.
                title: '%connection% wymaga ponownego połączenia'
            integration_scope_missing:
                body: >-
                    To połączenie działa, ale część uprawnień, o które plMail
                    prosił, nie została przyznana — więc części funkcji nie będą działać
                    i działać nie mogą. Przeglądanie może zwracać pustkę, podczas gdy zapisywanie nadal
                    się udaje, albo odwrotnie. Połącz je ponownie i zezwól na wszystko,
                    o co jesteś proszony.
                title: '%connection% nie otrzymało pełnego dostępu'
            push_degraded:
                body: >-
                    Rejestracja jest aktywna i nie wygasła, ale dotarła poczta,
                    o której nigdy nie powiadomiła — więc powiadomienia
                    giną gdzieś między dostawcą a tą instalacją, a nie to, że
                    nikt o nie nie prosi. W przypadku Gmail wskazuje to na subskrypcję
                    Pub/Sub w Google Cloud: sprawdź, czy nadal
                    przekazuje twój temat na ten adres. Twoja poczta nadal
                    dociera przy sprawdzaniu według harmonogramu, kilka
                    minut później, niż powinna.
                title: 'Natychmiastowe dostarczanie jest zarejestrowane, ale nie dociera dla %account%'
            push_lapsed:
                body: >-
                    Rejestracja wygasła i nie została odnowiona, więc nic nie jest
                    wysyłane push. Odnowienie działa raz dziennie samo; jeśli
                    ostatni przebieg poniżej był dni temu, proces roboczy zaplanowanych zadań
                    przestał działać i to jego trzeba naprawić, a nie to konto.
                    Twoja poczta nadal dociera przy sprawdzaniu według harmonogramu, kilka
                    minut później, niż powinna.
                title: 'Natychmiastowe dostarczanie wygasło dla %account%'
            queue_work_abandoned:
                body: >-
                    Zadań w tle (%count%) próbowało, wielokrotnie się nie powiodło i zostało
                    odłożonych, aby przestały ponawiać próby. Zwykle jest to
                    następstwo jednego z powyższych problemów, a nie
                    osobna usterka — napraw najpierw tamten, a potem przywróć te do
                    kolejki.
                title: 'Zadań w tle, z których zrezygnowano: %count%'
        outcome:
            calendar_failed_again: >-
                Znowu się nie powiodło. To, co powiedziało tym razem, jest poniżej — synchronizacja
                się uruchomiła, tylko nie zadziałała.
            calendar_still_waiting: >-
                Synchronizacja została uruchomiona, ale nic jeszcze nie wróciło. Spróbuj ponownie
                albo odśwież stronę, aby zobaczyć, dokąd doszła.
            calendar_synced: 'Zsynchronizowano. Ten kalendarz jest znowu aktualny.'
        pending:
            calendar_resync: 'Rozpoczynanie synchronizacji…'
            push_resubscribe: 'Włączanie z powrotem…'
            queue_discard: 'Odrzucanie…'
            queue_retry: 'Przywracanie…'
            reconnect: 'Przechodzenie do: %provider%…'
            reconnect_generic: 'Przechodzenie do logowania…'
        repair:
            calendar_resync:
                label: 'Spróbuj zsynchronizować teraz'
                promise: >-
                    Prosi ten kalendarz o natychmiastową ponowną synchronizację i przywraca go
                    do normalnego harmonogramu. Nic w nim nie jest usuwane.
            integration_grant:
                label: 'Przyznaj pełny dostęp'
                promise: >-
                    Zabiera cię z powrotem do %connection%, abyś zalogował się ponownie i przyznał
                    wszystko, o co plMail prosi. Nic tam zapisanego nie jest ruszane.
            integration_reconnect:
                label: 'Połącz ponownie'
                promise: >-
                    Wysyła cię do ponownego zalogowania, a potem przywraca istniejące
                    połączenie. Twoje filtry i zapisane miejsca docelowe nadal
                    działają.
            push_resubscribe:
                label: 'Włącz natychmiastowe dostarczanie z powrotem'
                promise: >-
                    Rejestruje to konto ponownie do natychmiastowego dostarczania. Twoja
                    poczta dociera tak czy inaczej, dopóki to jest naprawiane.
            queue_discard:
                label: 'Odrzuć je'
                promise: >-
                    Wyrzuca porzucone zadania bez ich uruchamiania. Nie ma
                    cofania, a wszystko, czego nie dokończyły, pozostaje
                    niedokończone.
            queue_retry:
                label: 'Przywróć je do kolejki'
                promise: >-
                    Próbuje porzuconych zadań jeszcze raz. Można bezpiecznie nacisnąć — każde
                    z nich, które znowu się nie powiedzie, po prostu wróci tutaj.
            grant_calendar:
                label: 'Przyznaj pełny dostęp'
                promise: >-
                    Zabiera cię z powrotem do dostawcy, abyś zalogował się jako %account% i
                    przyznał wszystko, o co plMail prosi. Nic w twojej poczcie
                    się nie zmienia i żadna poczta nie jest pobierana ponownie.
            reconnect_early:
                label: 'Zaloguj się ponownie teraz'
                promise: >-
                    Zabiera cię do ponownego zalogowania, zanim to obecne wygaśnie, aby
                    nic w międzyczasie nie przestało działać. Twoja poczta, foldery, etykiety,
                    filtry, kalendarze i ustawienia pozostają dokładnie takie, jakie są.
                    Musisz zalogować się jako %account%. To kupuje kolejny tydzień — nie
                    zapobiega ponownemu wystąpieniu problemu, a robi to publikacja
                    ekranu zgody.
            reconnect:
                label: 'Połącz to konto ponownie'
                promise: >-
                    Zabiera cię do ponownego zalogowania, a potem przypisuje nowe logowanie do
