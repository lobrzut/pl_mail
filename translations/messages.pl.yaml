            stalled_body: 'Od jakiegoś czasu nic się nie zmieniło — proces roboczy, który to robił, prawdopodobnie zniknął. Wznowienie podejmie pracę od miejsca, w którym stanęła.'
            start: 'Start'
            started_label: 'Rozpoczęto'
            tuning: '%batch% wiadomości w paczce, %delay% s przerwy między paczkami, a po każdym użyciu pomocy w pisaniu ustępuje na %cooldown% s.'
        duration:
            hours: '%count% h'
            minutes: '%count% min'
            seconds: '%count% s'
        embedding_preset:
            heading: 'Zmierzone ustawienia wstępne — jedno kliknięcie ustawia model, jego instrukcję i próg razem:'
            all-minilm: 'Mały i szybki: 45 MB i 384 wymiary, dla maszyny, która nie może poświęcić pamięci. Przede wszystkim angielski, więc przy niemieckiej poczcie spodziewaj się, że będzie najsłabszy z tych modeli. Nie potrzebuje instrukcji.'
            nomic-embed-text: 'To, co plMail polecał wcześniej, zachowane dla instalacji, które już go używają. Wspierany tylko połowicznie: chce mieć oznaczone zarówno dokumenty, jak i zapytania, czego plMail nie robi, a pomiary pokazały, że sama instrukcja zapytania niczego nie zmienia.'
            qwen3-embedding_0_6b: 'Domyślny i ten, który warto wybrać, o ile nie masz powodu, by wybrać inny. Wielojęzyczny, co dla skrzynki, w której nie wszystko jest w jednym języku, znaczy więcej niż jakikolwiek test porównawczy, i jedyny tutaj, który w testach osiągnął idealną precyzję. 639 MB.'
        field:
            base_url: 'Host modelu'
            base_url_help: 'W przypadku Ollama — adres kontenera w twojej sieci, razem z portem. W przypadku punktu końcowego zgodnego z OpenAI — korzeń API razem z wersją, na przykład https://api.example.com/v1.'
            categorisation: 'Sortuj pocztę do kart'
            categorisation_help: 'Działa na każdej nadchodzącej wiadomości. Rozstrzyga tylko w razie remisu — najpierw decydują zwykłe reguły.'
            chat_keep_alive: 'Trzymaj model do pisania załadowany przez'
            chat_keep_alive_help: '5m, 30m, 4h lub zwykła liczba sekund. -1 trzyma go załadowanego na stałe, 0 zwalnia go po każdym żądaniu. Dłużej oznacza, że pierwsza odpowiedź wraca szybciej; host przez cały ten czas i tak trzyma zarezerwowaną pamięć. Zostaw puste, aby użyć tego, co ustawiono na samym hoście.'
            chat_model: 'Model do pisania'
            chat_model_help: 'Używany do odpowiedzi, streszczeń i sortowania. Najlepiej taki dostrojony do instrukcji.'
            embedding_keep_alive: 'Trzymaj model wyszukiwania załadowany przez'
            embedding_keep_alive_help: 'Ten sam format co wyżej. Ten model jest mały i ciągle używany, więc -1 — załadowany na stałe — zwykle niewiele kosztuje i oszczędza czekanie przy każdym wyszukiwaniu; warto to ustawić, jeśli host ma zapas pamięci. Zostaw puste, aby użyć tego, co ustawiono na samym hoście.'
            embedding_base_url: 'Host wyszukiwania'
            embedding_model: 'Model wyszukiwania'
            embedding_own: 'Wyszukiwanie używa innego hosta modelu'
            embedding_own_help: 'Do uruchamiania modelu wyszukiwania gdzie indziej niż modelu do pisania: hostowany model do pisania i mały w domu do wyszukiwania albo odwrotnie. Każda wiadomość jest raz wysyłana na host wyszukiwania w celu zindeksowania. Jeśli model wyszukiwania ma tam taką samą nazwę, istniejący indeks zostaje zachowany.'
            embedding_provider: 'Dostawca hosta wyszukiwania'
            embedding_model_help: 'Zamienia pocztę na wektory, dzięki czemu wyszukiwanie znajduje znaczenie, a nie słowa.'
            hold: 'Czekaj na asystenta, zanim pokażesz nową pocztę w karcie'
            hold_help: 'Dla osób, które pozwalają asystentowi sortować pocztę. Nowa poczta jest trzymana poza kartami skrzynki odbiorczej przez chwilę potrzebną asystentowi, więc pojawia się raz, w odpowiedniej karcie, zamiast pojawić się w jednej i przeskoczyć do innej. Poczta sprowadzona przez pierwszy import nigdy nie jest wstrzymywana.'
            hold_max_seconds: 'Czekaj najwyżej (sekundy)'
            hold_max_seconds_help: 'Po tym czasie poczta jest pokazywana tam, gdzie umieszczają ją zwykłe reguły, bez względu na to, co robi asystent — i przenoszona, jeśli asystent odpowie później. Od 2 do 300.'
            search_query_instruction: 'Instrukcja zapytania'
            search_query_instruction_help: 'Umieszczana przed tekstem wyszukiwania przed jego osadzeniem. Większość modeli jej potrzebuje i bez niej odpowiada kiepsko; zostaw puste dla modeli, które jej nie potrzebują. Dotyczy tylko wyszukiwań, więc jej zmiana nigdy nie oznacza ponownego indeksowania poczty.'
            semantic_min_similarity: 'Minimalne podobieństwo'
            semantic_min_similarity_help: 'Jak bliskie musi być dopasowanie, od 0 do 1. Każdy model odpowiada we własnej skali, więc to ustawienie należy do modelu powyżej: zbyt wysokie nic nie znajdzie, zbyt niskie zwróci całą skrzynkę.'
            enabled: 'Używaj modelu językowego'
            headers: 'Dodatkowe nagłówki'
            headers_clear: 'Usuń zapisane nagłówki'
            headers_help: 'Po jednym w wierszu, w postaci Nazwa: wartość. Wysyłane z każdym żądaniem do hosta modelu, dla proxy lub bramy, która wymaga czegoś więcej niż tokenu. Przechowywane w postaci zaszyfrowanej i nigdy więcej nie pokazywane.'
            headers_help_set: 'Zapisane: %names%. Zostaw puste, aby je zachować. Cokolwiek tu wpiszesz, zastąpi je wszystkie; zapisane wartości nigdy nie są pokazywane.'
            provider: 'Dostawca'
            provider_help: 'Z jakim API rozmawia host modelu. Ollama to ten, o którym plMail wie najwięcej: potrafi trzymać model załadowany i załadować go z wyprzedzeniem. Zgodny z OpenAI obejmuje niemal całą resztę, w twojej własnej sieci lub hostowaną.'
            enabled_help: 'Domyślnie wyłączone. Wszystko poniżej jest ignorowane, dopóki to jest wyłączone.'
            search: 'Wyszukiwanie według znaczenia'
            search_help: 'Dodaje wyniki pasujące do tego, co miałeś na myśli. Zwykłe wyszukiwanie pozostaje bez zmian.'
            summary: 'Streszczenia wątków'
            summary_help: 'Używa modelu do pisania. Zimne żądanie trwa około minuty i przez cały ten czas zajmuje GPU.'
            token: 'Token'
            token_help: 'Tylko jeśli host jest za czymś, co go wymaga. Wysyłany jako token okaziciela z każdym żądaniem.'
            token_help_set: 'Token jest zapisany. Zostaw puste, aby go zachować. Zmiana adresu powyżej bez wpisania tokenu go usuwa.'
            writing_help: 'Pomóż mi pisać'
            writing_help_help: 'Oferuje wersje robocze i przeredagowania w oknie pisania, gdy o nie poprosisz.'
