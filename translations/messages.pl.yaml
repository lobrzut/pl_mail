    security:
        body: >-
            Twoja skrzynka jest kluczem do każdego innego twojego konta, bo tam
            trafiają resety haseł. Dodanie kodu z telefonu sprawia, że skradzione
            hasło samo nie wystarcza.
        done_body: >-
