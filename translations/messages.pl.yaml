                not_for_cloud_mail: 'Kalendarze Gmail i Outlook nie działają w ten sposób. Korzystają z logowania do poczty powyżej i wymagają tylko zaznaczonego uprawnienia do kalendarza w rejestracji tej aplikacji.'
                security: 'Użytkownicy powinni utworzyć hasło specyficzne dla aplikacji zamiast używać hasła logowania: hasła aplikacji można odwoływać pojedynczo i działają z uwierzytelnianiem dwuskładnikowym. iCloud i Fastmail nie przyjmują niczego innego.'
                step_app_password: 'Każdy użytkownik tworzy hasło aplikacji na swoim serwerze — Nextcloud w Ustawienia → Bezpieczeństwo, iCloud na appleid.apple.com, Fastmail w Ustawienia → Hasło i bezpieczeństwo — i wkleja je w swoich ustawieniach kalendarza.'
                step_base_url: 'Opcjonalnie przypnij adres serwera, na przykład https://cloud.example.com, jeśli wszyscy tutaj używają tego samego serwera.'
                step_enable: 'Włącz „Oferuj tę usługę użytkownikom” powyżej.'
                step_url: 'Adres do wpisania to adres CalDAV, a nie interfejsu webowego: Nextcloud pokazuje go w Kalendarz → Ustawienia → „Kopiuj główny adres CalDAV” i zwykle kończy się na /remote.php/dav. Działa też sama domena — plMail pyta ją, gdzie są jej kalendarze.'
            dropbox:
                intro: 'Dropbox wymaga aplikacji zarejestrowanej w konsoli deweloperskiej Dropbox.'
                refresh_note: 'Wybierz typ aplikacji z dostępem o ograniczonym zakresie i poproś o dostęp offline, bo inaczej połączenia przestaną działać po kilku godzinach.'
                step_app: 'Utwórz aplikację na dropbox.com/developers/apps z dostępem o ograniczonym zakresie do pełnego Dropbox.'
                step_paste: 'Skopiuj klucz aplikacji i sekret aplikacji do pól powyżej.'
                step_permissions: 'W sekcji Permissions włącz files.metadata.read, files.content.read i files.content.write.'
                step_redirect: 'W sekcji Settings dodaj URI przekierowania pokazane powyżej do OAuth 2 redirect URIs.'
            google:
                separate_from_gmail: 'Te poświadczenia są oddzielne od poświadczeń Gmail w twoim pliku środowiska. Możesz użyć tego samego projektu Cloud, ale ekran zgody musi wymieniać dodatkowe zakresy.'
                step_consent: 'Skonfiguruj ekran zgody OAuth i dodaj zakresy wymienione poniżej.'
                step_credentials: 'Utwórz OAuth 2.0 Client ID typu Web application.'
                step_paste: 'Skopiuj client ID i sekret klienta do pól powyżej.'
                step_project: 'Otwórz console.cloud.google.com i wybierz lub utwórz projekt.'
                step_redirect: 'Dodaj URI przekierowania pokazane powyżej do autoryzowanych URI przekierowania.'
            google_drive:
                intro: 'Dysk Google używa OAuth, więc plMail musi być zarejestrowany w Google, zanim ktokolwiek się połączy.'
                scopes: 'Wymagany zakres: pełny zakres drive. drive.file byłby węższy, ale widzi tylko pliki utworzone przez sam plMail, więc przeglądarka pokazałaby pusty Dysk — a linki udostępniania wymagają dostępu do zapisu pliku, który jest udostępniany. To zakres ograniczony: Google wymaga weryfikacji aplikacji, zanim użytkownicy spoza twojej listy testowej będą mogli wyrazić zgodę.'
                step_api: 'Włącz Google Drive API dla projektu.'
            google_photos:
                intro: 'Zdjęcia Google używają OAuth i własnego API, oddzielnego od Dysku.'
                scope_warning: 'Google ograniczył zakresy odczytu Zdjęć w marcu 2025. Nowo zarejestrowana aplikacja zwykle dostaje tylko appcreateddata, który widzi wyłącznie media wgrane przez sam plMail — przeglądanie istniejącej biblioteki wymaga zakresu photoslibrary.readonly, który Google przyznaje indywidualnie. Zapisywanie załączników w Zdjęciach działa tak czy inaczej; przeglądanie może pokazywać pustą bibliotekę, dopóki ten zakres nie zostanie zatwierdzony.'
                step_api: 'Włącz Photos Library API dla projektu.'
            immich:
                intro: 'Immich uwierzytelnia się kluczem API każdego użytkownika, więc nie ma tu nic do rejestrowania.'
                no_share_links: 'Immich nie potrafi utworzyć publicznego linku do pojedynczego zdjęcia — udostępnianie odbywa się na poziomie albumu. Zdjęcia powyżej limitu rozmiaru załącznika nie mogą więc być w ogóle dołączone.'
                step_base_url: 'Opcjonalnie przypnij adres serwera, na przykład https://photos.example.com.'
                step_enable: 'Włącz „Oferuj tę usługę użytkownikom” powyżej.'
                step_key: 'Każdy użytkownik generuje klucz API w Immich w Ustawienia konta → Klucze API i wkleja go w swoich ustawieniach integracji.'
            nextcloud:
                intro: 'Nextcloud uwierzytelnia się hasłem aplikacji każdego użytkownika, więc nie ma tu nic do rejestrowania.'
                security: 'Użytkownicy powinni utworzyć hasło aplikacji, a nie używać hasła logowania: hasła aplikacji można odwoływać pojedynczo i działają z uwierzytelnianiem dwuskładnikowym.'
                step_base_url: 'Opcjonalnie przypnij adres serwera, na przykład https://cloud.example.com.'
                step_enable: 'Włącz „Oferuj tę usługę użytkownikom” powyżej.'
                step_user: 'Każdy użytkownik tworzy hasło aplikacji w Nextcloud w Ustawienia → Bezpieczeństwo → Urządzenia i sesje i wkleja je w swoich ustawieniach integracji.'
            one_drive:
                intro: 'OneDrive używa Microsoft Graph, tego samego API co konta pocztowe Microsoft, ale wymaga uprawnień Files, których rejestracja poczty nie nadaje.'
                step_paste: 'Skopiuj identyfikator aplikacji (client) i wartość sekretu do pól powyżej.'
                step_permissions: 'W sekcji API permissions dodaj delegowane uprawnienia Microsoft Graph Files.ReadWrite i offline_access.'
                step_redirect: 'W sekcji Authentication dodaj URI przekierowania pokazane powyżej jako przekierowanie platformy Web.'
                step_register: 'Otwórz portal Azure i zarejestruj aplikację w Microsoft Entra ID → App registrations.'
                step_secret: 'W sekcji Certificates & secrets utwórz sekret klienta i od razu skopiuj jego wartość — jest pokazywana tylko raz.'
                tenant_note: 'Użyj tenanta common dla prywatnych kont Microsoft albo identyfikatora swojego tenanta, aby ograniczyć dostęp do swojej organizacji.'
            paperless:
                asynchronous: 'Zapisanie załącznika przekazuje go konsumentowi Paperless, który archiwizuje go kilka sekund później. plMail zgłasza przekazanie, a nie gotowy dokument — więc testowy zapis pojawia się w Paperless chwilę po tym, jak zostanie zgłoszony jako zakończony, a plik, który Paperless odrzuci jako duplikat, nie pojawia się wcale.'
                intro: 'Paperless-ngx uwierzytelnia się tokenem API każdego użytkownika, więc nie ma tu nic do rejestrowania.'
                no_share_links: 'plMail nie tworzy linków udostępniania Paperless. Udostępnianie tam to osobna funkcja z uprawnieniami i własnym terminem ważności, a opublikowanie dokumentu to większy krok niż dołączenie go — więc dokumenty powyżej limitu rozmiaru załącznika nie mogą być w ogóle dołączone.'
                step_base_url: 'Opcjonalnie przypnij adres serwera, na przykład https://paperless.example.com.'
                step_enable: 'Włącz „Oferuj tę usługę użytkownikom” powyżej.'
                step_token: 'Każdy użytkownik kopiuje swój token API z Paperless w My Profile → API Auth Token i wkleja go w swoich ustawieniach integracji.'
