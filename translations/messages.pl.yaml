demo:
    bar:
        title: Demo
        blurb: Skrzynka jednorazowa. Nic tu nie jest prawdziwe, a nic, co wyślesz, nie opuszcza serwera.
        next: 'Dalej: %subject%'
        receive: Odbierz pocztę
    flash:
        blocked: Łączenie prawdziwej skrzynki jest w wersji demo wyłączone.
    login:
        blurb: Rozejrzyj się po plMail z własną skrzynką — bez rejestracji, bez adresu.
        start: Uruchom demo
        disclaimer: Twoja skrzynka demo zostanie automatycznie usunięta po kilku godzinach.
    privacy:
        account: >-
            Uruchomienie dema tworzy jednorazowe konto z losowo wygenerowanym
            adresem. Nie jesteś proszony o imię, adres e-mail ani hasło, i żadne
            z nich nie jest zapisywane. Wszystko, co do niego wpiszesz — wiadomości, wersje
            robocze, wpisy kalendarza — istnieje tylko w tym koncie i jest z nim usuwane, automatycznie,
            mniej więcej %ttl% po jego utworzeniu. Poczta napisana w demo nigdy nie jest wysyłana:
            nie ma połączenia z żadnym serwerem poczty.
        account_title: Konto demo
        complaint: >-
            Masz także prawo wnieść skargę do organu nadzorczego ds. ochrony
            danych.
        controller_intro: 'Odpowiedzialny za opisane tu przetwarzanie:'
        controller_title: Administrator danych
        controller_unset: 'Nie ustawiono. Informacja o prywatności musi wskazywać administratora danych — ustaw te dane, zanim udostępnisz tę instancję publicznie.'
        cookie_mercure: utrzymuje otwarte połączenie aktualizacji na żywo, gdy jesteś zalogowany.
        cookie_session: utrzymuje cię zalogowanego na koncie demo. Usuwany po zamknięciu przeglądarki.
        cookie_ui: zapamiętuje wybrany motyw i język.
        cookies: >-
            Ustawiane są trzy pliki cookie, wszystkie ściśle niezbędne do działania
            usługi. Nie ma plików cookie śledzących, reklamowych ani analitycznych,
            a zatem nie ma banera zgody.
        cookies_title: Pliki cookie
        host: Serwer jest prowadzony w naszym imieniu przez %host%, działającego jako podmiot przetwarzający na podstawie umowy powierzenia przetwarzania danych.
        host_unset: 'Nie ustawiono. Firma prowadząca serwer jest podmiotem przetwarzającym i musi być tu wskazana.'
        logs: >-
            Jak każdy serwer WWW, ten zapisuje każde żądanie: adres IP, z którego
            przyszło, czas, żądaną stronę, stronę odsyłającą i ciąg user-agent
            przeglądarki. Jest to konieczne do prowadzenia usługi i obrony jej
            przed atakami (art. 6 ust. 1 lit. f RODO — prawnie uzasadniony interes). Te dzienniki są
            rotowane i nie służą do budowania profilu nikogo.
        logs_title: Pliki dzienników serwera
        processing_title: Co jest przetwarzane i na jakiej podstawie
        rights: >-
            Masz prawo do informacji o danych, które są o tobie przechowywane, oraz do ich
            sprostowania, usunięcia lub ograniczenia przetwarzania, a także prawo do sprzeciwu wobec
            przetwarzania i prawo do przenoszenia danych. Napisz na powyższy adres.
        rights_title: Twoje prawa
        stats: >-
            Aby zobaczyć, jak bardzo demo jest używane, liczona jest każda rozpoczęta sesja demo.
            Przechowywany jest czas i kluczowany skrót adresu IP z odciętą ostatnią częścią
            (ostatni oktet adresu IPv4, ostatnie 80 bitów adresu IPv6) —
            nigdy sam adres. Skrót pokazuje tylko, że dwie sesje pochodziły z tej samej
            sieci, i jest usuwany po %days% dniach (art. 6 ust. 1 lit. f RODO —
            prawnie uzasadniony interes w wiedzy, jak bardzo demo jest używane).
        stats_title: 'Statystyki użycia'
        third_parties: >-
            Żadne dane nie są przekazywane osobom trzecim. Ta strona nie ładuje zewnętrznych czcionek,
            skryptów, map ani analityki — jej polityka bezpieczeństwa treści pozwala na połączenia
            wyłącznie z tym serwerem.
        third_parties_title: Osoby trzecie
        title: Informacja o prywatności
    unavailable:
        title: Niedostępne w demo
        body: >-
            Łączenie prawdziwej skrzynki jest tutaj wyłączone. To demo działa na
            serwerze, którego nie kontrolujesz, i żaden obcy nie powinien wpisywać
            w nim swojego hasła do poczty. Cała reszta — motywy, filtry,
            kalendarz, pisanie poczty — działa tak samo jak na twojej własnej instalacji.
        dismiss: Wróć do dema
    impressum:
        link: Nota prawna
        title: Nota prawna
        heading: Informacje zgodnie z § 5 TMG
        operator: Operator
        unset: 'Nie ustawiono. Ta strona ma prawny obowiązek wskazywać prawdziwego operatora — ustaw te dane w środowisku, zanim udostępnisz tę instancję publicznie.'
        contact: Kontakt
        contact_email: 'E-mail:'
        disclaimer_title: O tym demo
        disclaimer: >-
            To jest demonstracja plMail. Pokazane skrzynki, nadawcy i
            wiadomości są zmyślone; żadna z nich nie jest prawdziwą korespondencją.
            Poczta napisana tutaj nigdy nie opuszcza serwera, a konta demo są
            automatycznie usuwane po kilku godzinach.
        privacy_title: Dane
        privacy: >-
            Wizyta w demo tworzy jednorazowe konto bez żadnych danych osobowych.
            Wszystko, co do niego wpiszesz, jest usuwane razem z kontem. Dzienniki
            serwera zapisują adresy IP z zwykłych powodów operacyjnych i są
            rotowane.
        source_title: Kod źródłowy
        source: 'plMail to wolne oprogramowanie na licencji AGPL-3.0:'
